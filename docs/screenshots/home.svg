<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Avari Domains homepage preview</title><desc id="desc">Dark domain diagnostics landing page with domain search and three feature cards.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1725"/><stop offset="1" stop-color="#080e18"/></linearGradient><linearGradient id="accent"><stop stop-color="#ff9c5b"/><stop offset="1" stop-color="#f56839"/></linearGradient><radialGradient id="glow"><stop stop-color="#15314b" stop-opacity=".9"/><stop offset="1" stop-color="#080e18" stop-opacity="0"/></radialGradient></defs>
<rect width="1440" height="900" fill="url(#bg)"/><ellipse cx="730" cy="120" rx="660" ry="360" fill="url(#glow)"/>
<path d="M0 80h1440" stroke="#ffffff" stroke-opacity=".08"/><g font-family="Arial,sans-serif" fill="#e9f2fc"><path d="m45 49 16-33 17 33-9-4-8-17-8 17z" fill="none" stroke="#ff8951" stroke-width="2"/><text x="88" y="46" font-size="20" font-weight="700" letter-spacing="2">AVARI DOMAINS</text><text x="1120" y="46" font-size="14" fill="#9aabc0">Проверка</text><text x="1230" y="46" font-size="14" fill="#9aabc0">История</text>
<text x="720" y="178" text-anchor="middle" font-size="13" fill="#80dafa" letter-spacing="3">● ДОМЕННАЯ ДИАГНОСТИКА В РЕАЛЬНОМ ВРЕМЕНИ</text><text x="720" y="282" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="-3">Проверь домен,</text><text x="720" y="358" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="-3" fill="#ff8d52">сайт и почту.</text><text x="720" y="412" text-anchor="middle" font-size="18" fill="#99acc1">Регистрация, DNS, сертификат, доступность сайта</text><text x="720" y="440" text-anchor="middle" font-size="18" fill="#99acc1">и настройки почты — в одном отчёте.</text>
<rect x="275" y="490" width="890" height="82" rx="14" fill="#111c2a" stroke="#41617d"/><text x="309" y="541" font-size="29" fill="#78bde1">⌕</text><text x="360" y="538" font-size="17" fill="#71869c">Введите домен или URL</text><rect x="1002" y="502" width="149" height="58" rx="9" fill="url(#accent)"/><text x="1076" y="538" text-anchor="middle" font-size="16" font-weight="700" fill="#1c100a">Проверить →</text>
<text x="720" y="613" text-anchor="middle" font-size="13" fill="#7f91a7">Попробуйте:　 example.com　　яндекс.рф　　www.github.com</text>
