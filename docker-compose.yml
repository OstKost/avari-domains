services:
  avari:
    build:
      context: .
      args:
        VITE_YM_ID: ${VITE_YM_ID:-113253415}
        VITE_YM_WEBVISOR: ${VITE_YM_WEBVISOR:-true}
        VITE_GA_ID: ${VITE_GA_ID:-}
    ports:
      - "127.0.0.1:${PORT:-18080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /data/avari.sqlite
      STATIC_DIR: /app/dist
      LISTEN_ADDR: :8080
      TRUSTED_PROXY_IPS: 127.0.0.1
      PORKBUN_API_KEY: ${PORKBUN_API_KEY:-}
      PORKBUN_SECRET_API_KEY: ${PORKBUN_SECRET_API_KEY:-}
      REG_RU_URL: ${REG_RU_URL:-}
    volumes:
      - avari_data:/data
    restart: unless-stopped
volumes:
  avari_data:
