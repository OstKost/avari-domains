<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e18"/>
      <stop offset="50%" stop-color="#0c1829"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a32"/>
      <stop offset="100%" stop-color="#86e8ff"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#6bb9dc" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="200" cy="150" r="280" fill="#15314b" fill-opacity="0.4" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="250" fill="#572a1b" fill-opacity="0.25" filter="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(100, 100) scale(1.8)">
    <rect width="56" height="56" rx="14" fill="#0c1726" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M6 48 28 5l22 43-11-5-11-23-11 23Z" fill="none" stroke="url(#logo-grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M15 37h26M22 48l6-10 6 10" stroke="#8ee7ff" stroke-width="2.2"/>
  </g>

  <!-- Brand Name -->
  <text x="230" y="166" font-family="Manrope, system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" letter-spacing="2" fill="#ffffff">AVARI<tspan fill="#86e8ff">DOMAINS</tspan></text>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="Manrope, system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" fill="url(#text-grad)" line-height="1.2">
    Диагностика домена, сайта,
  </text>
  <text x="100" y="355" font-family="Manrope, system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" fill="url(#text-grad)" line-height="1.2">
    DNS, TLS и почты
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="Manrope, system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#94a3b8">
    Полный технический аудит доступности, сертификатов, записей MX, SPF, DKIM и DMARC
  </text>

  <!-- Feature Badges -->
  <g transform="translate(100, 480)">
    <!-- Badge 1: RDAP & WHOIS -->
    <rect x="0" y="0" width="200" height="50" rx="12" fill="#0f2137" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="100" y="32" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">✓ RDAP &amp; WHOIS</text>

    <!-- Badge 2: DNS & Delegation -->
    <rect x="220" y="0" width="220" height="50" rx="12" fill="#0f2137" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="330" y="32" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600" fill="#818cf8" text-anchor="middle">✓ DNS &amp; Delegation</text>

    <!-- Badge 3: TLS & Security -->
    <rect x="460" y="0" width="190" height="50" rx="12" fill="#0f2137" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="555" y="32" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle">✓ TLS / HTTPS</text>

    <!-- Badge 4: Mail SPF DKIM -->
    <rect x="670" y="0" width="240" height="50" rx="12" fill="#0f2137" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="790" y="32" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle">✓ SPF / DKIM / DMARC</text>
  </g>

  <!-- Footer Link -->
  <text x="1100" y="585" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600" fill="#64748b" text-anchor="end">domains.avari.dev</text>
</svg>
