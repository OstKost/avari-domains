name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_YM_ID: ${{ vars.VITE_YM_ID || '113253415' }}
          VITE_YM_WEBVISOR: ${{ vars.VITE_YM_WEBVISOR || 'true' }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID || '' }}
        run: npm ci && npm run build
      - name: Build backend
        working-directory: backend
        run: go build ./...

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: deployment-secrets
        name: Check deployment secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [[ -z "$VPS_SSH_KEY" || -z "$VPS_HOST" || -z "$VPS_USER" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set VPS_HOST, VPS_USER, and VPS_SSH_KEY in the production environment to enable deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install SSH key
        if: steps.deployment-secrets.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload application
        if: steps.deployment-secrets.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_API_KEY: ${{ secrets.PORKBUN_SECRET_API_KEY }}
          REG_RU_URL: ${{ secrets.REG_RU_URL }}
        run: |
          cat <<EOF > .env.deploy
          PORKBUN_API_KEY=${PORKBUN_API_KEY}
          PORKBUN_SECRET_API_KEY=${PORKBUN_SECRET_API_KEY}
          REG_RU_URL=${REG_RU_URL}
          EOF
          tar -czf - \
            --exclude='./.git' --exclude='./.env' --exclude='./data' \
            --exclude='./*.sqlite*' --exclude='./frontend/node_modules' \
            --exclude='./frontend/dist' --exclude='./Avari Domains Artifact' . \
            | ssh -T -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST"
      - name: Report deployment
        if: steps.deployment-secrets.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: echo "Deployment stream delivered to $VPS_HOST"
