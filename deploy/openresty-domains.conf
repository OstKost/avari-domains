# Managed by this repository. OpenResty includes this file from /opt/om/nginx/conf/sites/.
server {
    listen 80;
    server_name domains.avari.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name domains.avari.dev;

    ssl_certificate /etc/letsencrypt/live/domains.avari.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domains.avari.dev/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
